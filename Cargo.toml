[package]
name = "t0k3n-mcp"
version = "0.1.0"
edition = "2024"
description = "Token-saving MCP server for AI coding tools"
license = "MIT"

[[bin]]
name = "t0k3n-mcp"
path = "src/main.rs"

[dependencies]
# MCP protocol
rmcp = { version = "0.3", features = ["server", "transport-io"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Code analysis (tree-sitter)
tree-sitter = "0.24"

# HTML→Markdown
htmd = "0.1"

# PDF conversion
pdf-extract = "0.7"

# DOCX conversion
docx-rs = "0.4"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP fetching
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }

# File system (.gitignore-aware walk)
ignore = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
